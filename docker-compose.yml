
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    env_file:
      # Picks up MARKET_DATA_SOURCE/UPSTOX_* (and anything else) from the root
      # .env. Without this, the container never sees those variables and
      # silently falls back to the SIMULATOR feed regardless of configuration.
      - ./.env
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/proptrading
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      # Vite's bundler (rolldown) ships platform-specific native binaries.
      # Bind-mounting the host's node_modules straight into this Alpine
      # (musl) container serves whatever was `npm install`-ed on the host
      # OS (Windows/glibc-Linux/macOS) instead, which is missing the
      # linux-musl binary this container actually needs -- the dev server
      # crash-loops on startup with "Cannot find native binding" and never
      # serves anything. This named volume shadows node_modules so the
      # container keeps its own install, built for its own platform.
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proptrading
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
